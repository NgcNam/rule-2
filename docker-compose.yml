services:
  rulebase:
    build:
      context: .
      dockerfile: Dockerfile
    image: rulebase-spam:latest
    container_name: rulebase-spam
    ports:
      # Truy cập LAN: http://<IP-server>:5000
      # Muốn dùng cổng 80 (http://<IP-server>) thì đổi thành "80:5000".
      - "5000:5000"
    volumes:
      # kết quả mỗi lần chạy (folder <dataset>/, report .xlsx, các step*.json)
      - ./output:/data
    environment:
      RULEBASE_OUTPUT_DIR: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
